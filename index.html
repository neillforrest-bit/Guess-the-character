<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="description" content="A simple two-player Guess Who game."/><title>Guess Who?</title><link rel="stylesheet" href="styles.css"/></head><body><main class="app"><header><p class="eyebrow">Two-player game</p><h1>Guess Who?</h1><p class="intro">Take turns asking yes-or-no questions. Cross out characters until you can make a guess.</p></header><section class="controls"><div class="turn" id="turn" aria-live="polite">Player 1's turn</div><button id="new-game" type="button">New game</button></section><section class="question-panel"><h2>Ask a question</h2><div class="questions" id="questions"></div><div class="trivia-row"><button id="trivia-button" type="button">Spot Trivia <small>1 use</small></button><span>Win a clue, extra turn, or mute.</span></div><p id="answer" class="answer" aria-live="polite">Choose a question to start.</p><p id="reward" class="reward" hidden></p></section><section><div class="board-header"><h2>Character board</h2><p>Tap a card to cross it out.</p></div><div id="board" class="board" aria-live="polite"></div></section><dialog id="guess-dialog"><form method="dialog" id="guess-form"><h2>Make your guess</h2><label for="guess-select">Who is your opponent?</label><select id="guess-select" required></select><div class="dialog-actions"><button value="cancel" type="button" id="cancel-guess">Cancel</button><button value="default" type="submit">Guess</button></div></form></dialog><dialog id="trivia-dialog"><form method="dialog" id="trivia-form"><p class="eyebrow">Spot Trivia</p><h2 id="trivia-question"></h2><div id="trivia-options" class="trivia-options"></div></form></dialog><button id="guess-button" class="guess-button" type="button">Make a guess</button></main><script src="app.js"></script></body></html>
