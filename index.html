<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A two-player Guess Who game." />
    <title>Guess Who?</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <p class="eyebrow">Two-player game</p>
        <h1>Guess Who?</h1>
        <p class="intro">Take turns asking yes-or-no questions. Cross out characters until you can make a guess.</p>
      </header>

      <section class="controls" aria-label="Game controls">
        <div class="turn" id="turn" aria-live="polite">Player 1's turn</div>
        <button id="new-game" type="button">New game</button>
      </section>

      <section class="question-panel" aria-labelledby="questions-heading">
        <h2 id="questions-heading">Ask a question</h2>
        <div class="questions" id="questions"></div>
        <p id="answer" class="answer" aria-live="polite">Choose a question to start.</p>
      </section>

      <section aria-labelledby="characters-heading">
        <div class="board-header">
          <h2 id="characters-heading">Character board</h2>
          <p>Click a card to cross it out.</p>
        </div>
        <div id="board" class="board" aria-live="polite"></div>
      </section>

      <dialog id="guess-dialog">
        <form method="dialog" id="guess-form">
          <h2>Make your guess</h2>
          <label for="guess-select">Who is your opponent?</label>
          <select id="guess-select" required></select>
          <div class="dialog-actions">
            <button value="cancel" type="button" id="cancel-guess">Cancel</button>
            <button value="default" type="submit">Guess</button>
          </div>
        </form>
      </dialog>
      <button id="guess-button" class="guess-button" type="button">Make a guess</button>
    </main>
    <script src="app.js"></script>
  </body>
</html>
