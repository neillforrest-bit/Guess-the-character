<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#5b21b6"/><title>Guess Who? 1v1</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="styles.css"/></head><body class="min-h-screen text-white"><main class="mx-auto max-w-xl px-4 pb-8"><header class="sticky top-0 z-20 -mx-4 border-b border-white/15 bg-violet-950/70 px-4 pb-3 pt-[max(1rem,env(safe-area-inset-top))] backdrop-blur-xl"><div class="flex items-center justify-between"><div><p class="text-xs font-bold uppercase tracking-[.24em] text-fuchsia-200">Two phones · one mystery</p><h1 class="text-3xl font-black tracking-tight">Guess Who?</h1></div><span id="turn-badge" class="rounded-full bg-white/15 px-3 py-2 text-xs font-bold">Lobby</span></div><p id="status-copy" class="mt-2 text-sm text-violet-100">Create a game and invite a friend.</p></header><section class="mt-4 rounded-3xl border border-white/20 bg-white/10 p-4 shadow-2xl backdrop-blur-xl"><div class="flex items-center justify-between gap-3"><span id="invite-copy" class="text-sm font-semibold">Start a private 1v1 game.</span><button id="share-button" class="rounded-2xl bg-fuchsia-500 px-4 py-3 text-sm font-black shadow-lg shadow-fuchsia-500/30">Create & share</button></div></section><section id="lobby" class="mt-4 rounded-3xl border border-white/20 bg-white/10 p-5 text-center backdrop-blur-xl"><h2 class="text-xl font-black">Waiting room</h2><p id="lobby-copy" class="mt-2 text-violet-100">Character selection unlocks at 2/2 players.</p></section><section id="game" hidden class="mt-4"><div id="board" class="grid grid-cols-2 gap-3 pb-4 sm:grid-cols-3" aria-live="polite"></div><section class="rounded-3xl border border-white/20 bg-white/10 p-4 backdrop-blur-xl"><div id="messages" class="max-h-32 space-y-2 overflow-y-auto text-sm text-violet-50"></div><form id="ask-form" class="mt-3 flex gap-2"><input id="question-input" maxlength="100" placeholder="Ask a Yes / No question" class="min-w-0 flex-1 rounded-2xl border border-white/20 bg-white/10 px-3 py-3 placeholder:text-violet-200"/><button class="rounded-2xl bg-violet-500 px-4 font-bold">Ask</button></form><div id="answer-controls" hidden class="mt-3 grid grid-cols-2 gap-2"><button data-answer="yes" class="rounded-2xl bg-emerald-500 py-3 font-black">Yes</button><button data-answer="no" class="rounded-2xl bg-rose-500 py-3 font-black">No</button></div></section><div class="mt-4 grid grid-cols-2 gap-3"><button id="twist-button" class="rounded-2xl border border-amber-200/30 bg-amber-400/20 py-4 font-black text-amber-100">Twist</button><button id="guess-button" class="rounded-2xl bg-fuchsia-500 py-4 font-black">Make a Guess</button></div></section></main><dialog id="secret-dialog" class="glass-dialog"><form id="secret-form"><p class="text-fuchsia-200">Your secret stays on this phone.</p><h2>Pick your character</h2><select id="secret-select"></select><button id="lock-secret" type="submit">Lock it in</button></form></dialog><dialog id="guess-dialog" class="glass-dialog"><form id="guess-form"><h2>Who is their character?</h2><select id="guess-select"></select><button type="submit">Make a Guess</button><button id="cancel-guess" type="button">Cancel</button></form></dialog><dialog id="twist-dialog" class="glass-dialog"><form id="twist-form"><p class="text-amber-200">Twist challenge</p><h2 id="trivia-question"></h2><div id="trivia-options"></div></form></dialog><dialog id="notice-dialog" class="glass-dialog"><form method="dialog"><h2 id="notice-title">Game update failed</h2><p id="notice-copy"></p><button>OK</button></form></dialog><script type="module" src="app.js"></script></body></html>
